<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fef9ef">
  <meta name="description" content="Короткая анкета для создания визуального брендбука.">
  <title>Анкета для визуального брендбука</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203342;background:#fef9ef;font-synthesis:none}
    *{box-sizing:border-box}html{-webkit-font-smoothing:antialiased}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,rgba(162,210,255,.44),transparent 31%),radial-gradient(circle at 90% 85%,rgba(254,228,64,.17),transparent 30%),#fef9ef}
    button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ac762b;outline-offset:3px}
    .shell{max-width:1130px;min-height:100vh;margin:auto;padding:30px clamp(20px,5vw,68px) 28px;display:flex;flex-direction:column}
    footer,.actions{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .main{flex:1;display:flex;align-items:center;padding:54px 0 64px}
    .panel{width:100%;max-width:830px;margin:0 auto;animation:rise .3s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{margin:0 0 21px;color:#b46544;font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}
    h1,h2{margin:0;font-weight:550;letter-spacing:-.045em;line-height:1.08}h1{font-size:clamp(46px,7.5vw,86px)}h2{font-size:clamp(35px,5.4vw,60px)}
    .sub{max-width:620px;margin:22px 0 0;color:#5a6d76;font-size:clamp(16px,2vw,19px);line-height:1.55}
    .primary{display:inline-flex;align-items:center;justify-content:center;gap:15px;min-height:56px;padding:0 24px;border:1px solid #b78235;border-radius:10px;background:linear-gradient(115deg,#a97329 0%,#eac77b 47%,#bf8938 100%);color:#252a2b;box-shadow:0 10px 24px rgba(153,105,37,.18);font-size:15px;font-weight:750;transition:filter .2s,transform .2s,box-shadow .2s}
    .primary:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 14px 28px rgba(153,105,37,.22)}.primary:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}
    .ghost{color:#536a78;background:transparent;border:0;padding:13px 8px;font-size:14px}.ghost:hover{color:#203342}
    .options{display:grid;gap:11px;margin-top:34px}.option{width:100%;min-height:82px;text-align:left;display:flex;align-items:center;gap:18px;padding:16px 20px;border:1px solid #c4d8e2;border-radius:12px;background:rgba(255,255,255,.76);color:#203342;box-shadow:0 4px 20px rgba(68,114,144,.05);transition:border-color .2s,background .2s,transform .2s}
    .option:hover{border-color:#ff865e;background:#fff;transform:translateX(3px)}.option.selected{border-color:#bc8837;background:#fff8e8;box-shadow:0 0 0 1px #e1bd72,0 6px 22px rgba(153,105,37,.1)}
    .number{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;border:1px solid #a8c8db;border-radius:7px;color:#46657b;font-size:13px}
    .option.selected .number{background:linear-gradient(135deg,#a97329,#f0d38a,#bf8938);border-color:#b78235;color:#252a2b}.option strong,.option small{display:block}.option strong{font-size:17px;font-weight:600}.option small{color:#657984;font-size:13px;margin-top:5px;line-height:1.35}
    .palette-section{margin-top:30px}.palette-heading{font-size:17px;font-weight:600;margin:0 0 7px}.palette-hint{font-size:13px;color:#5d707b;line-height:1.5;margin:0 0 16px}.palette-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
    .palette-card{text-align:left;background:#fff;border:1px solid #c4d8e2;border-radius:11px;color:#203342;padding:9px;transition:border-color .2s,transform .2s}.palette-card:hover{border-color:#ff865e;transform:translateY(-2px)}.palette-card.selected{border-color:#b78235;background:#fff8e8;box-shadow:0 0 0 1px #e1bd72}
    .palette-card img{display:block;width:100%;height:110px;object-fit:contain;background:#fff;border-radius:7px}.palette-name{display:flex;justify-content:space-between;gap:7px;align-items:center;padding:10px 2px 2px;font-size:13px}.palette-card.selected .palette-name:after{content:'✓';color:#a97329;font-weight:700}
    .detail{margin-top:22px}.field-label{display:block;color:#314d5d;font-size:13px;margin-bottom:9px}
    textarea,input[type=text]{width:100%;color:#203342;background:#fff;border:1px solid #b9d1df;border-radius:9px;padding:15px 17px;font-size:15px}
    textarea{min-height:100px;resize:vertical;line-height:1.5}textarea::placeholder,input::placeholder{color:#7c8f98}
    .actions{margin-top:30px}.actions .primary{min-width:163px}.error{color:#a63d28;font-size:14px;line-height:1.5;min-height:20px;margin:14px 0 0}
    .fields{max-width:590px;display:grid;gap:20px;margin-top:35px}.help{color:#667b84;font-size:12px;line-height:1.5;margin:13px 0 0}
    .success-icon{width:66px;height:66px;border:1px solid #bd8b3b;border-radius:50%;display:grid;place-items:center;color:#9d6b24;font-size:31px;margin-bottom:34px;background:#fff6df}
    footer{color:#6d818b;font-size:11px;line-height:1.4}
    @media(max-width:600px){.shell{padding:22px 20px 24px}.main{align-items:flex-start;padding:60px 0 50px}.option{padding:15px;min-height:78px}.option strong{font-size:15px}.option small{font-size:12px}.palette-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.palette-card img{height:95px}.actions .primary{min-width:0}footer{align-items:flex-start;flex-direction:column;gap:6px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <main class="main" id="app" aria-live="polite"></main>
    <footer><span>Ваши ответы используются для подготовки визуального брендбука.</span><span>10 вопросов · около 5 минут</span></footer>
  </div>

    function go(step){state.step=step;state.error='';render();window.scrollTo({top:0,behavior:'smooth'})}
    function render(){
      if(state.step===-1){app.innerHTML='<section class="panel"><p class="eyebrow">Анкета · визуальный брендбук</p><h1>Давайте найдём облик вашего бренда.</h1><button class="primary" id="start" type="button" style="margin-top:42px">Начать анкету ↗</button></section>';document.getElementById('start').onclick=()=>go(0);return}
      if(state.step===11){app.innerHTML='<section class="panel"><div class="success-icon">✓</div><p class="eyebrow">Анкета отправлена</p><h2>Спасибо за ваши ответы.</h2><p class="sub">Мы получили ваш бриф и используем его как основу для визуального брендбука.</p></section>';return}
      if(state.step===10){
        app.innerHTML='<section class="panel"><p class="eyebrow">Последний шаг</p><h2>Оставьте ваш Telegram.</h2><p class="sub">Прикрепим ник к ответам, чтобы обсудить бриф при необходимости.</p><div class="fields"><div><label class="field-label" for="contact">Ваш ник в Telegram *</label><input id="contact" type="text" maxlength="33" autocomplete="off" placeholder="@username" value="'+esc(state.contact)+'"></div></div><p class="error" id="error" role="alert">'+esc(state.error)+'</p><div class="actions"><button class="ghost" id="back" type="button">← Вернуться</button><button class="primary" id="send" type="button" '+(state.sending?'disabled':'')+'>'+(state.sending?'Отправляем…':'Отправить ответы ↗')+'</button></div></section>';
        document.getElementById('contact').oninput=e=>{state.contact=e.target.value;save()};
        document.getElementById('back').onclick=()=>go(9);document.getElementById('send').onclick=send;return;
      }
      const q=questions[state.step],choice=state.answers[state.step],selected=Number.isInteger(choice),free=q.type==='text',colors=q.type==='palette';
      const options=free||colors?'':'<div class="options" role="group" aria-label="Варианты ответа">'+q.options.map((o,i)=>'<button class="option '+(choice===i?'selected':'')+'" type="button" data-choice="'+i+'" aria-pressed="'+(choice===i)+'"><span class="number">'+(i+1)+'</span><span><strong>'+esc(o[0])+'</strong><small>'+esc(o[1])+'</small></span></button>').join('')+'</div>';
      const label=state.step===4&&choice===1?q.alternatePrompt:q.prompt;
      const showDetail=free||colors||selected&&(!q.required||q.required.includes(choice));
      const detail=showDetail?'<div class="detail"><label class="field-label" for="detail">'+esc(label)+(free||q.required?' *':' (необязательно)')+'</label><textarea id="detail" maxlength="700" placeholder="'+esc(q.placeholder||'Расскажите своими словами…')+'">'+esc(state.details[state.step]||'')+'</textarea></div>':'';
      app.innerHTML='<section class="panel"><p class="eyebrow">О вашем бренде</p><h2>'+esc(q.title)+'</h2><p class="sub">'+esc(q.hint)+'</p>'+options+(colors?'<div class="palette-section"><p class="palette-hint">Выберите до двух. Если на картинке два варианта, уточните ниже — левый или правый. Ещё палитры подобраны на <a href="https://colorhunt.co/" target="_blank" rel="noopener noreferrer">Color Hunt</a>.</p><div class="palette-grid">'+paletteImages.map((src,i)=>'<button class="palette-card '+(state.palettes.includes(i+1)?'selected':'')+'" type="button" data-palette="'+(i+1)+'" aria-pressed="'+state.palettes.includes(i+1)+'"><img src="'+src+'" alt="Цветовая палитра '+(i+1)+'" loading="lazy"><span class="palette-name">Палитра '+(i+1)+(i>=7?' · Color Hunt':'')+'</span></button>').join('')+'</div></div>':'')+detail+'<p class="error" id="error" role="alert">'+esc(state.error)+'</p><div class="actions"><button class="ghost" id="back" type="button">← Назад</button><button class="primary" id="next" type="button" '+(!free&&!colors&&!selected?'disabled':'')+'>'+(state.step===9?'К завершению':'Продолжить')+' →</button></div></section>';
      if(colors){
        const gallery=app.querySelector('.palette-section');
        gallery.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{
          const n=Number(b.dataset.palette);
          if(state.palettes.includes(n))state.palettes=state.palettes.filter(p=>p!==n);
          else if(state.palettes.length<2)state.palettes.push(n);
          else {state.error='Можно выбрать не больше двух палитр.';document.getElementById('error').textContent=state.error;return}
          state.error='';save();render();
        });
      }
      app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const chosen=Number(b.dataset.choice);state.answers[state.step]=chosen;if(q.required&&!q.required.includes(chosen))state.details[state.step]='';state.error='';save();render()});
      const detailField=document.getElementById('detail');if(detailField)detailField.oninput=e=>{state.details[state.step]=e.target.value;save()};
      document.getElementById('back').onclick=()=>go(state.step-1);
      document.getElementById('next').onclick=()=>{
        if(!free&&!colors&&!Number.isInteger(state.answers[state.step]))return;
        if(colors&&!state.palettes.length){state.error='Выберите хотя бы одну палитру.';document.getElementById('error').textContent=state.error;return}
        if((free||q.required&&q.required.includes(state.answers[state.step]))&&!(state.details[state.step]||'').trim()){
          state.error='Пожалуйста, напишите ответ.';document.getElementById('error').textContent=state.error;if(detailField)detailField.focus();return;
        }
        go(state.step+1);
      };
    }
    async function send(){
      if(state.sending)return;
      const contact=state.contact.trim();if(!/^@?[A-Za-z0-9_]{5,32}$/.test(contact)){state.error='Укажите ник в Telegram, например @username.';document.getElementById('error').textContent=state.error;document.getElementById('contact').focus();return}
      state.sending=true;state.error='';render();
      try{const response=await fetch('https://brandbook-brief-roman.pastel-seal-2668.chatgpt.site/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contact:contact.startsWith('@')?contact:'@'+contact,answers:questions.map((q,i)=>q.type?null:state.answers[i]),details:questions.map((_,i)=>state.details[i]||''),palettes:state.palettes})});
        if(!response.ok){const result=await response.json().catch(()=>({}));throw new Error(result.message||'Не удалось отправить ответы. Попробуйте ещё раз.')}
        localStorage.removeItem(key);state.step=11;render()
      }catch(e){state.error=e.message||'Не удалось отправить ответы. Попробуйте ещё раз.';state.sending=false;render()}
    }
    document.addEventListener('keydown',event=>{if(state.step<0||state.step>9||event.altKey||event.ctrlKey||event.metaKey||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
      if(['1','2','3'].includes(event.key)){const b=app.querySelector('[data-choice="'+(Number(event.key)-1)+'"]');if(b)b.click()}
      if(event.key==='Enter'){const b=document.getElementById('next');if(b&&!b.disabled)b.click()}
    });
    render();
  </script>
</body>
</html>
